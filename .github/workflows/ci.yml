name: CI

# Every push to main and every pull request: types, formatting, tests (the engine against a mock
# Steam CDN on loopback), and a build. On Windows too, where most people run Steam Boost.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # The same on every OS (line endings are LF everywhere, see .gitattributes): once is enough.
      - name: Formatting
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build && npm run build:cli
